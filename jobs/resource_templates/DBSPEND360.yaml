resources:
  jobs:
    DBSpend360:
      name: DBSpend360
      tasks:
        - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/${cloud_provider}_cloud_cost_explorer_app
            source: WORKSPACE
        - task_key: Dbspend360dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_dbu_cost_app
            source: WORKSPACE
        - task_key: databricks_job_spends
          depends_on:
            - task_key: Dbspend360dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/databricks_job_spends_app
            source: WORKSPACE
        - task_key: Dbspend360_all_purpose_dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_all_purpose_dbu_cost_app
            source: WORKSPACE
        - task_key: all_purpose_spends
          depends_on:
            - task_key: Dbspend360_all_purpose_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/all_purpose_spends_app
            source: WORKSPACE
        - task_key: Dbspend360_pool_dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_pool_dbu_cost_app
            source: WORKSPACE
        - task_key: pool_spends
          depends_on:
            - task_key: Dbspend360_pool_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/pool_spends_app
            source: WORKSPACE
        - task_key: Dbspend360_pipeline_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_pipeline_dbu_cost_app
            source: WORKSPACE
        - task_key: pipeline_spends
          depends_on:
            - task_key: Dbspend360_pipeline_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/pipeline_spends_app
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: dbspend360
        - name: cloud_provider
          default: aws
        - name: overlap_days
          default: "10"
        - name: schema
          default: 04june
        - name: workspace_ids
          default: ""
      performance_target: PERFORMANCE_OPTIMIZED
