resources:
  jobs:
    DBSpend360:
      name: DBSpend360
      tasks:
        - task_key: create_covered_workspaces_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/ddls/dbspend360_covered_workspaces
            source: WORKSPACE
        - task_key: covered_workspaces
          depends_on:
            - task_key: create_covered_workspaces_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_covered_workspaces_app
            source: WORKSPACE
        - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/${cloud_provider}_cloud_cost_explorer_app
            source: WORKSPACE
        - task_key: Dbspend360dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
            - task_key: covered_workspaces
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_dbu_cost_app
            source: WORKSPACE
        - task_key: databricks_job_spends
          depends_on:
            - task_key: Dbspend360dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/databricks_job_spends_app
            source: WORKSPACE
        - task_key: Dbspend360_all_purpose_dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
            - task_key: covered_workspaces
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_all_purpose_dbu_cost_app
            source: WORKSPACE
        - task_key: all_purpose_spends
          depends_on:
            - task_key: Dbspend360_all_purpose_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/all_purpose_spends_app
            source: WORKSPACE
        - task_key: Dbspend360_pool_dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
            - task_key: covered_workspaces
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_pool_dbu_cost_app
            source: WORKSPACE
        - task_key: pool_spends
          depends_on:
            - task_key: Dbspend360_pool_dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/pool_spends_app
            source: WORKSPACE
        - task_key: create_pipeline_dbu_cost_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/ddls/dbspend360_pipeline_dbu_cost
            source: WORKSPACE
        - task_key: create_total_pipeline_spends_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/ddls/dbspend360_total_pipeline_spends
            source: WORKSPACE
        - task_key: Dbspend360_pipeline_dbu_costs
          depends_on:
            - task_key: create_pipeline_dbu_cost_table
            - task_key: covered_workspaces
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_pipeline_dbu_cost_app
            source: WORKSPACE
        - task_key: pipeline_spends
          depends_on:
            - task_key: create_total_pipeline_spends_table
            - task_key: Dbspend360_pipeline_dbu_costs
            - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/pipeline_spends_app
            source: WORKSPACE
        - task_key: create_sql_warehouse_dbu_cost_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/ddls/dbspend360_sql_warehouse_dbu_cost
            source: WORKSPACE
        - task_key: create_total_sql_warehouse_spends_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/ddls/dbspend360_total_sql_warehouse_spends
            source: WORKSPACE
        - task_key: Dbspend360_sql_warehouse_dbu_costs
          depends_on:
            - task_key: create_sql_warehouse_dbu_cost_table
            - task_key: covered_workspaces
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/dbspend360_sql_warehouse_dbu_cost_app
            source: WORKSPACE
        - task_key: sql_warehouse_spends
          depends_on:
            - task_key: Dbspend360_sql_warehouse_dbu_costs
            - task_key: create_total_sql_warehouse_spends_table
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/deployed from cursor/jobs/notebooks/sql_warehouse_spends_app
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: dbspend360
        - name: cloud_provider
          default: aws
        - name: overlap_days
          default: "10"
        - name: schema
          default: 04june
        - name: workspace_ids
          default: ""
        # Azure-only widgets for ${cloud_provider}_cloud_cost_explorer_app.
        # AWS/GCP notebooks don't read these, so the empty defaults are inert
        # there; an Azure deployment overrides them with the subscription id and
        # the secret-scope name holding tenant_id/client_id/client_secret.
        - name: subscription_id
          default: ""
        - name: scope
          default: ""
      performance_target: PERFORMANCE_OPTIMIZED
