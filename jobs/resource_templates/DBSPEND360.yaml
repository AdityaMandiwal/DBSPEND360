resources:
  jobs:
    DBSpend360:
      name: DBSpend360
      tasks:
        - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/DBSpend360-app-v2/${cloud_provider}_cloud_cost_explorer_app
            source: WORKSPACE
        - task_key: Dbspend360dbu_costs
          depends_on:
            - task_key: cloud_cost_explorer
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/DBSpend360-app-v2/dbspend360_dbu_cost_app
            source: WORKSPACE
        - task_key: databricks_job_spends
          depends_on:
            - task_key: Dbspend360dbu_costs
          notebook_task:
            notebook_path: /Workspace/Users/aditya.mandiwal@databricks.com/DBSpend360-app-v2/databricks_job_spends_app
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: dbspend360
        - name: cloud_provider
          default: aws
        - name: overlap_days
          default: "10"
        - name: schema
          default: 03apr
        - name: workspace_ids
          default: ""
      performance_target: PERFORMANCE_OPTIMIZED
