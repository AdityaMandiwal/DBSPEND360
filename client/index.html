<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Databricks FastAPI App" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>Databricks FastAPI App</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dbspend360-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
